name: Validate and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUXT_PUBLIC_STATS_ENABLED: ${{ vars.MUKUCHI_STATS_ENABLED || 'false' }}
      NUXT_ADMIN_ENABLED: ${{ vars.MUKUCHI_ADMIN_ENABLED || 'false' }}
      NUXT_PUBLIC_AUTH_ENABLED: ${{ vars.MUKUCHI_ADMIN_ENABLED || 'false' }}
      NUXT_PUBLIC_GISCUS_REPO: ${{ vars.MUKUCHI_GISCUS_REPO || 'setobox/mukuchi' }}
      NUXT_PUBLIC_GISCUS_REPO_ID: ${{ vars.MUKUCHI_GISCUS_REPO_ID }}
      NUXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.MUKUCHI_GISCUS_CATEGORY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.15.0
        with:
          version: 0.2.8
          node-version: 24.21.0
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run -r test
      - name: Prepare AI summaries
        run: vp run website#ai:prepare
        env:
          MUKUCHI_AI_REMOTE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'true' || 'false' }}
          CLOUDFLARE_API_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MUKUCHI_ADMIN_DATABASE_ID: 3453b53f-aba4-43cf-8103-f5a69fb59f87
          NUXT_AI_ENCRYPTION_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.NUXT_AI_ENCRYPTION_KEY || '' }}
      - run: vp run -r build
        env:
          MUKUCHI_GITHUB_TOKEN: ${{ github.token }}
          MUKUCHI_AI_SNAPSHOT_FROZEN: 'true'
      - run: vp run website#check:prerender
      - run: vp run website#stats:check-build
      - run: vp run website#admin:check-build
      - run: vp run website#build:cloudflare
        env:
          MUKUCHI_GITHUB_TOKEN: ${{ github.token }}
          MUKUCHI_AI_SNAPSHOT_FROZEN: 'true'
      - run: vp run website#check:prerender
      - run: vp run website#stats:check-build
      - run: vp run website#admin:check-build
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: vp run website#deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          vp run website#smoke
          vp run website#admin:smoke:production
        env:
          MUKUCHI_SMOKE_URL: ${{ vars.MUKUCHI_SMOKE_URL }}
