name: Validate and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUXT_PUBLIC_STATS_ENABLED: ${{ vars.MUKUCHI_STATS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.15.0
        with:
          version: 0.2.8
          node-version: 24.21.0
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run -r test
      - run: vp run -r build
        env:
          MUKUCHI_GITHUB_TOKEN: ${{ github.token }}
      - run: vp run website#check:prerender
      - run: vp run website#stats:check-build
      - run: vp run website#build:cloudflare
        env:
          MUKUCHI_GITHUB_TOKEN: ${{ github.token }}
      - run: vp run website#check:prerender
      - run: vp run website#stats:check-build
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: vp run website#deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: vp run website#smoke
        env:
          MUKUCHI_SMOKE_URL: ${{ vars.MUKUCHI_SMOKE_URL }}
